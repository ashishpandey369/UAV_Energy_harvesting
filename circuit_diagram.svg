<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <!-- Glow and shadow filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="lipoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="oledGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="1000" height="56" fill="#1e293b"/>
  <text x="30" y="36" fill="#38bdf8" font-size="22" font-weight="bold">3S LiPo Voltmeter + Energy Harvesting Charger Monitor</text>
  <text x="760" y="35" fill="#94a3b8" font-size="14">ESP32 + SSD1306 OLED</text>
  <line x1="0" y1="56" x2="1000" y2="56" stroke="#334155" stroke-width="2"/>

  <!-- ==================== 1. BATTERY BALANCE CONNECTOR ==================== -->
  <g transform="translate(30, 90)">
    <!-- Battery Body Outline -->
    <rect x="0" y="0" width="220" height="280" rx="12" fill="url(#lipoGrad)" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="36" rx="12" fill="#334155"/>
    <text x="110" y="24" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">3S LiPo BATTERY</text>
    <text x="110" y="55" fill="#38bdf8" font-size="12" text-anchor="middle">11.1V Nominal (12.6V Max)</text>

    <!-- Cells internal graphic -->
    <rect x="20" y="70" width="180" height="35" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="30" y="92" fill="#e2e8f0" font-size="12" font-weight="bold">Cell 1</text>
    <text x="170" y="92" fill="#38bdf8" font-size="12" text-anchor="end">3.7 - 4.2V</text>

    <rect x="20" y="115" width="180" height="35" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="30" y="137" fill="#e2e8f0" font-size="12" font-weight="bold">Cell 2</text>
    <text x="170" y="137" fill="#38bdf8" font-size="12" text-anchor="end">3.7 - 4.2V</text>

    <rect x="20" y="160" width="180" height="35" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="30" y="182" fill="#e2e8f0" font-size="12" font-weight="bold">Cell 3</text>
    <text x="170" y="182" fill="#38bdf8" font-size="12" text-anchor="end">3.7 - 4.2V</text>

    <!-- Balance Port Label -->
    <rect x="20" y="210" width="180" height="55" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <text x="110" y="230" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">4-PIN BALANCE CONNECTOR</text>

    <!-- 4 Pins inside connector -->
    <!-- Pin 1: GND -->
    <circle cx="45" cy="248" r="6" fill="#000000" stroke="#94a3b8" stroke-width="2"/>
    <text x="45" y="262" fill="#94a3b8" font-size="9" text-anchor="middle">Pin 1</text>
    <!-- Pin 2: Tap 1 -->
    <circle cx="88" cy="248" r="6" fill="#eab308" stroke="#fef08a" stroke-width="1.5"/>
    <text x="88" y="262" fill="#fde047" font-size="9" text-anchor="middle">Pin 2</text>
    <!-- Pin 3: Tap 2 -->
    <circle cx="132" cy="248" r="6" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="132" y="262" fill="#93c5fd" font-size="9" text-anchor="middle">Pin 3</text>
    <!-- Pin 4: Tap 3 -->
    <circle cx="175" cy="248" r="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="175" y="262" fill="#f87171" font-size="9" text-anchor="middle">Pin 4</text>
  </g>

  <!-- ==================== 2. BREADBOARD / RESISTOR NETWORK ==================== -->
  <g transform="translate(290, 80)">
    <!-- Breadboard base plate -->
    <rect x="0" y="0" width="370" height="570" rx="14" fill="url(#boardGrad)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <text x="185" y="28" fill="#1e293b" font-size="16" font-weight="bold" text-anchor="middle">BREADBOARD RESISTOR NETWORK</text>
    <line x1="20" y1="40" x2="350" y2="40" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Common Ground Rail (Left Blue Rail) -->
    <rect x="18" y="55" width="26" height="495" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="31" y1="65" x2="31" y2="540" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 4"/>
    <text x="31" y="295" fill="#1d4ed8" font-size="12" font-weight="bold" transform="rotate(-90, 31, 295)" text-anchor="middle">COMMON GND (BLUE RAIL)</text>

    <!-- ---------- DIVIDER 1 (CELL 1) ---------- -->
    <g transform="translate(70, 60)">
      <rect x="0" y="0" width="280" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="24" rx="8" fill="#fef9c3"/>
      <text x="10" y="17" fill="#854d0e" font-size="12" font-weight="bold">DIVIDER 1 — CELL 1 (Tap 1: 0 to 4.2V)</text>
      
      <!-- Battery In Terminal -->
      <circle cx="20" cy="50" r="5" fill="#eab308"/>
      <text x="32" y="54" fill="#334155" font-size="11" font-weight="bold">Tap 1 In (Yellow)</text>

      <!-- Resistor R1_top (12k) -->
      <rect x="30" y="70" width="75" height="24" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="67" y="86" fill="#854d0e" font-size="11" font-weight="bold" text-anchor="middle">12 kΩ (R_top)</text>
      <line x1="20" y1="50" x2="20" y2="82" stroke="#eab308" stroke-width="2"/>
      <line x1="20" y1="82" x2="30" y2="82" stroke="#eab308" stroke-width="2"/>

      <!-- Junction 1 -->
      <circle cx="125" cy="82" r="6" fill="#0284c7"/>
      <line x1="105" y1="82" x2="145" y2="82" stroke="#0284c7" stroke-width="2"/>
      <text x="125" y="72" fill="#0369a1" font-size="10" font-weight="bold" text-anchor="middle">Junction 1</text>

      <!-- Resistor R1_bottom (12k) to GND -->
      <line x1="125" y1="88" x2="125" y2="100" stroke="#0284c7" stroke-width="2"/>
      <rect x="90" y="100" width="70" height="22" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <text x="125" y="115" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">12 kΩ</text>
      <line x1="90" y1="111" x2="10" y2="111" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="10" cy="111" r="4" fill="#3b82f6"/>
      <text x="12" y="125" fill="#2563eb" font-size="9">to GND</text>

      <!-- Output to ESP32 -->
      <line x1="145" y1="82" x2="265" y2="82" stroke="#0284c7" stroke-width="3"/>
      <circle cx="265" cy="82" r="5" fill="#0284c7"/>
      <text x="260" y="72" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="end">To GPIO 34</text>
      <text x="260" y="100" fill="#16a34a" font-size="10" text-anchor="end">Max ~2.10V (Safe)</text>
    </g>

    <!-- ---------- DIVIDER 2 (CELL 2) ---------- -->
    <g transform="translate(70, 220)">
      <rect x="0" y="0" width="280" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="24" rx="8" fill="#dbeafe"/>
      <text x="10" y="17" fill="#1e40af" font-size="12" font-weight="bold">DIVIDER 2 — CELL 1+2 (Tap 2: 0 to 8.4V)</text>
      
      <!-- Battery In Terminal -->
      <circle cx="20" cy="50" r="5" fill="#3b82f6"/>
      <text x="32" y="54" fill="#334155" font-size="11" font-weight="bold">Tap 2 In (Blue)</text>

      <!-- Resistor R2_top (50k) -->
      <rect x="30" y="70" width="75" height="24" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="67" y="86" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">50 kΩ (R_top)</text>
      <line x1="20" y1="50" x2="20" y2="82" stroke="#3b82f6" stroke-width="2"/>
      <line x1="20" y1="82" x2="30" y2="82" stroke="#3b82f6" stroke-width="2"/>

      <!-- Junction 2 -->
      <circle cx="125" cy="82" r="6" fill="#7c3aed"/>
      <line x1="105" y1="82" x2="145" y2="82" stroke="#7c3aed" stroke-width="2"/>
      <text x="125" y="72" fill="#6d28d9" font-size="10" font-weight="bold" text-anchor="middle">Junction 2</text>

      <!-- Resistor R2_bottom (12k) to GND -->
      <line x1="125" y1="88" x2="125" y2="100" stroke="#7c3aed" stroke-width="2"/>
      <rect x="90" y="100" width="70" height="22" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <text x="125" y="115" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">12 kΩ</text>
      <line x1="90" y1="111" x2="10" y2="111" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="10" cy="111" r="4" fill="#3b82f6"/>
      <text x="12" y="125" fill="#2563eb" font-size="9">to GND</text>

      <!-- Output to ESP32 -->
      <line x1="145" y1="82" x2="265" y2="82" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="265" cy="82" r="5" fill="#7c3aed"/>
      <text x="260" y="72" fill="#7c3aed" font-size="11" font-weight="bold" text-anchor="end">To GPIO 35</text>
      <text x="260" y="100" fill="#16a34a" font-size="10" text-anchor="end">Max ~1.63V (Safe)</text>
    </g>

    <!-- ---------- DIVIDER 3 (TOTAL PACK) ---------- -->
    <g transform="translate(70, 380)">
      <rect x="0" y="0" width="280" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="24" rx="8" fill="#fee2e2"/>
      <text x="10" y="17" fill="#991b1b" font-size="12" font-weight="bold">DIVIDER 3 — TOTAL (Tap 3: 0 to 12.6V)</text>
      
      <!-- Battery In Terminal -->
      <circle cx="20" cy="50" r="5" fill="#ef4444"/>
      <text x="32" y="54" fill="#334155" font-size="11" font-weight="bold">Tap 3 In (Red)</text>

      <!-- Resistor R3_top (100k) -->
      <rect x="30" y="70" width="75" height="24" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
      <text x="67" y="86" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle">100 kΩ (R_top)</text>
      <line x1="20" y1="50" x2="20" y2="82" stroke="#ef4444" stroke-width="2"/>
      <line x1="20" y1="82" x2="30" y2="82" stroke="#ef4444" stroke-width="2"/>

      <!-- Junction 3 -->
      <circle cx="125" cy="82" r="6" fill="#ea580c"/>
      <line x1="105" y1="82" x2="145" y2="82" stroke="#ea580c" stroke-width="2"/>
      <text x="125" y="72" fill="#c2410c" font-size="10" font-weight="bold" text-anchor="middle">Junction 3</text>

      <!-- Resistor R3_bottom (12k) to GND -->
      <line x1="125" y1="88" x2="125" y2="100" stroke="#ea580c" stroke-width="2"/>
      <rect x="90" y="100" width="70" height="22" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
      <text x="125" y="115" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">12 kΩ</text>
      <line x1="90" y1="111" x2="10" y2="111" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="10" cy="111" r="4" fill="#3b82f6"/>
      <text x="12" y="125" fill="#2563eb" font-size="9">to GND</text>

      <!-- Output to ESP32 -->
      <line x1="145" y1="82" x2="265" y2="82" stroke="#ea580c" stroke-width="3"/>
      <circle cx="265" cy="82" r="5" fill="#ea580c"/>
      <text x="260" y="72" fill="#ea580c" font-size="11" font-weight="bold" text-anchor="end">To GPIO 36 (VP)</text>
      <text x="260" y="100" fill="#16a34a" font-size="10" text-anchor="end">Max ~1.35V (Safe)</text>
    </g>
  </g>

  <!-- ==================== 3. ESP32 & OLED MODULE ==================== -->
  <g transform="translate(710, 80)">
    <!-- ESP32 Board -->
    <rect x="0" y="0" width="260" height="340" rx="10" fill="url(#espGrad)" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#1e293b"/>
    <text x="130" y="24" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">ESP32 DevKit V1</text>

    <!-- Metal Shield -->
    <rect x="60" y="60" width="140" height="120" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="130" y="125" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle">ESP-WROOM-32</text>

    <!-- Pin Headers (Left Side) -->
    <!-- GPIO 36 (VP) -->
    <circle cx="18" cy="80" r="7" fill="#ea580c" stroke="#fed7aa" stroke-width="2"/>
    <text x="32" y="85" fill="#fdba74" font-size="11" font-weight="bold">GPIO 36 (VP)</text>
    <!-- GPIO 35 -->
    <circle cx="18" cy="120" r="7" fill="#7c3aed" stroke="#ddd6fe" stroke-width="2"/>
    <text x="32" y="125" fill="#c4b5fd" font-size="11" font-weight="bold">GPIO 35</text>
    <!-- GPIO 34 -->
    <circle cx="18" cy="160" r="7" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
    <text x="32" y="165" fill="#7dd3fc" font-size="11" font-weight="bold">GPIO 34</text>
    <!-- GND Pin -->
    <circle cx="18" cy="220" r="7" fill="#2563eb" stroke="#bfdbfe" stroke-width="2"/>
    <text x="32" y="225" fill="#60a5fa" font-size="11" font-weight="bold">GND</text>
    
    <!-- Pin Headers (Right Side for OLED) -->
    <!-- 3V3 Pin -->
    <circle cx="242" cy="80" r="7" fill="#ef4444" stroke="#fecaca" stroke-width="2"/>
    <text x="228" y="85" fill="#f87171" font-size="11" font-weight="bold" text-anchor="end">3V3</text>
    <!-- GND Pin -->
    <circle cx="242" cy="120" r="7" fill="#2563eb" stroke="#bfdbfe" stroke-width="2"/>
    <text x="228" y="125" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="end">GND</text>
    <!-- GPIO 22 (SCL) -->
    <circle cx="242" cy="160" r="7" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
    <text x="228" y="165" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="end">GPIO 22 (SCL)</text>
    <!-- GPIO 21 (SDA) -->
    <circle cx="242" cy="200" r="7" fill="#f59e0b" stroke="#fde68a" stroke-width="2"/>
    <text x="228" y="205" fill="#fcd34d" font-size="11" font-weight="bold" text-anchor="end">GPIO 21 (SDA)</text>

    <!-- MicroUSB connector at bottom -->
    <rect x="95" y="325" width="70" height="15" rx="3" fill="#64748b"/>
    <text x="130" y="315" fill="#94a3b8" font-size="10" text-anchor="middle">USB to PC</text>

    <!-- ---------- OLED DISPLAY ---------- -->
    <g transform="translate(10, 360)">
      <rect x="0" y="0" width="240" height="200" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
      <rect x="0" y="0" width="240" height="26" rx="8" fill="#334155"/>
      <text x="120" y="18" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">SSD1306 OLED (128x64)</text>

      <!-- OLED Screen Bezel -->
      <rect x="20" y="38" width="200" height="135" rx="4" fill="#000000" stroke="#0ea5e9" stroke-width="2" filter="url(#glow-cyan)"/>
      
      <!-- Live Display Mockup -->
      <text x="120" y="58" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">3S LIPO VOLTMETER</text>
      <line x1="28" y1="64" x2="212" y2="64" stroke="#0284c7" stroke-width="1"/>
      
      <text x="32" y="82" fill="#ffffff" font-size="11" font-family="monospace">C1: 3.85V</text>
      <rect x="110" y="73" width="90" height="10" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <rect x="112" y="75" width="60" height="6" fill="#38bdf8"/>

      <text x="32" y="104" fill="#ffffff" font-size="11" font-family="monospace">C2: 3.84V</text>
      <rect x="110" y="95" width="90" height="10" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <rect x="112" y="97" width="58" height="6" fill="#38bdf8"/>

      <text x="32" y="126" fill="#ffffff" font-size="11" font-family="monospace">C3: 3.86V</text>
      <rect x="110" y="117" width="90" height="10" fill="none" stroke="#38bdf8" stroke-width="1"/>
      <rect x="112" y="119" width="62" height="6" fill="#38bdf8"/>

      <line x1="28" y1="138" x2="212" y2="138" stroke="#0284c7" stroke-width="1"/>
      <text x="32" y="157" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="bold">TOT: 11.55V  65%</text>

      <!-- OLED Header Pins at top of module -->
      <text x="120" y="188" fill="#94a3b8" font-size="10" text-anchor="middle">GND | VCC | SCL | SDA</text>
    </g>
  </g>

  <!-- ==================== CONNECTING WIRES ==================== -->
  <!-- Wire from Battery Pin 1 (GND) to Breadboard GND Rail -->
  <path d="M 75 338 L 75 420 L 321 420" fill="none" stroke="#000000" stroke-width="4"/>
  <path d="M 75 338 L 75 420 L 321 420" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="321" cy="420" r="5" fill="#2563eb"/>

  <!-- Wire from Breadboard GND Rail to ESP32 GND -->
  <path d="M 321 450 L 321 520 L 700 520 L 700 300 L 728 300" fill="none" stroke="#2563eb" stroke-width="3"/>
  
  <!-- Wire from Battery Pin 2 (Tap 1 / Yellow) to Divider 1 -->
  <path d="M 118 338 L 118 192 L 360 192" fill="none" stroke="#eab308" stroke-width="3"/>

  <!-- Wire from Battery Pin 3 (Tap 2 / Blue) to Divider 2 -->
  <path d="M 162 338 L 162 352 L 360 352" fill="none" stroke="#3b82f6" stroke-width="3"/>

  <!-- Wire from Battery Pin 4 (Tap 3 / Red) to Divider 3 -->
  <path d="M 205 338 L 205 512 L 360 512" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Wire from Divider 1 (Junction 1) to ESP32 GPIO 34 -->
  <path d="M 625 222 L 675 222 L 675 240 L 728 240" fill="none" stroke="#0284c7" stroke-width="3"/>

  <!-- Wire from Divider 2 (Junction 2) to ESP32 GPIO 35 -->
  <path d="M 625 382 L 685 382 L 685 200 L 728 200" fill="none" stroke="#7c3aed" stroke-width="3"/>

  <!-- Wire from Divider 3 (Junction 3) to ESP32 GPIO 36 (VP) -->
  <path d="M 625 542 L 695 542 L 695 160 L 728 160" fill="none" stroke="#ea580c" stroke-width="3"/>

  <!-- Wire from ESP32 to OLED Display -->
  <!-- 3V3 (Red) -->
  <path d="M 952 160 L 980 160 L 980 430 L 940 430" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- SCL (Green) -->
  <path d="M 952 240 L 970 240 L 970 435 L 930 435" fill="none" stroke="#10b981" stroke-width="2"/>
  <!-- SDA (Yellow) -->
  <path d="M 952 280 L 960 280 L 960 440 L 920 440" fill="none" stroke="#f59e0b" stroke-width="2"/>

</svg>